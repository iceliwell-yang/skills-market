.staticrypt-content { width: 100%; display: flex; align-items: center; justify-content: center; }
.staticrypt-page { width: 100%; max-width: 400px; margin: 0 auto; }
.staticrypt-form {

}

.staticrypt-logo {

    display: flex; align-items: center; justify-content: center;
    font-size: 27px; font-weight: 700; color: #fff;

    box-shadow: 0 8px 20px rgba(37,99,235,0.35);
}
.staticrypt-title { font-size: 22px; font-weight: 700; color: #1f2937; margin-bottom: 8px; }
.staticrypt-instructions > p:last-child { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 6px; }
.staticrypt-hr { display: none; }
.staticrypt-password-container { position: relative; margin: 22px 0 16px; }
.staticrypt-password-container input[type="password"], .staticrypt-password-container input[type="text"] {
    width: 100%; padding: 14px 46px 14px 16px; font-size: 15px;
    border: 1.5px solid #e5e7eb; border-radius: 12px; background: #f9fafb;
    outline: none; color: #1f2937; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;

.staticrypt-password-container input:focus { border-color: #2563eb; background: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,0.12); }

.staticrypt-decrypt-button {
    width: 100%; padding: 14px; font-size: 15px; font-weight: 600; letter-spacing: 0.3px;
    color: #fff; border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    box-shadow: 0 8px 20px rgba(37,99,235,0.3); transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
}
.staticrypt-decrypt-button:hover { transform: translateY(-1px); filter: brightness(1.05); box-shadow: 0 12px 26px rgba(37,99,235,0.4); }
.staticrypt-decrypt-button:active { transform: translateY(0); filter: brightness(0.95); }
.staticrypt-remember { display: none !important; }
