<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.5" stop-color="#0d1124"/>
      <stop offset="1" stop-color="#120b26"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow1)"/>
  <rect width="1280" height="720" fill="url(#glow2)"/>

  <!-- logo -->
  <rect x="90" y="88" width="72" height="72" rx="18" fill="url(#brand)"/>
  <path d="M126 100l8.6 17.4 19.2 2.8-13.9 13.5 3.3 19.2-17.2-9-17.2 9 3.3-19.2-13.9-13.5 19.2-2.8z" fill="#fff"/>

  <!-- 主标题 -->
  <text x="90" y="330" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="64" font-weight="700" fill="#e8ecf6">WorkBuddy 入门指南</text>

  <!-- 副标题 -->
  <text x="90" y="400" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" fill="#8b96b0">从界面解析到核心功能 · 60 分钟保姆级教程</text>

  <!-- 底部标签 -->
  <rect x="90" y="470" rx="999" width="150" height="40" fill="#4f7cff" fill-opacity="0.18"/>
  <text x="115" y="497" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#7c9bff">零基础友好</text>

  <rect x="255" y="470" rx="999" width="170" height="40" fill="#a855f7" fill-opacity="0.18"/>
  <text x="280" y="497" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#c08aff">12 张操作截图</text>

  <rect x="440" y="470" rx="999" width="170" height="40" fill="#7c5cff" fill-opacity="0.18"/>
  <text x="465" y="497" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#a38cff">保姆级教程</text>
